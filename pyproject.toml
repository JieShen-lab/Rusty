[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rusty-novel"
version = "0.1.0"
description = "Local desktop tool for importing, parsing, previewing, and exporting novel projects."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "charset-normalizer>=3.3",
    "ebooklib>=0.18",
    "fastapi>=0.115",
    "httpx>=0.27",
    "keyring>=25.0",
    "python-docx>=1.1",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.7",
    "pyinstaller>=6.0",
    "pytest>=8.0",
    "keyrings.alt>=5.0",
]

[project.scripts]
rusty-init-db = "rusty.db.schema:main"

[tool.setuptools.packages.find]
where = ["src"]
