[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rusty-novel"
version = "0.1.0"
description = "Local desktop tool for importing, parsing, previewing, and exporting novel projects."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "beautifulsoup4>=4.12",
    "charset-normalizer>=3.3",
    "ebooklib>=0.18",
    "keyring>=25.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
ai = [
    "httpx>=0.27",
    "openai>=1.40",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
rusty = "rusty.__main__:main"
rusty-init-db = "rusty.db.schema:main"

[tool.setuptools.packages.find]
where = ["src"]
